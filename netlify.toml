# ── Configuration Netlify ─────────────────────────────────────
# Le secrets-scanner de Netlify bloque le build quand il retrouve la
# valeur d'une variable d'env dans les fichiers générés. Ici c'est attendu :
#
#  • NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY
#    sont PUBLIQUES par conception (intégrées au bundle client ;
#    la clé anon est protégée par les politiques RLS de Supabase).
#
#  • SUPABASE_SERVICE_ROLE_KEY / DASHBOARD_PASSWORD ne vivent que dans
#    les fonctions serveur (jamais envoyées au navigateur).
#
# On indique donc au scanner d'ignorer ces clés.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,DASHBOARD_PASSWORD"
